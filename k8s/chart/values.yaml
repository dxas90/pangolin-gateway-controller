replicaCount: 2

image:
  repository: "ghcr.io/dxas90/pangolin-gateway-controller"
  pullPolicy: "IfNotPresent"
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: "pangolin-gateway-controller"
  projectedToken:
    enabled: true
    expirationSeconds: 3600
    audience: ""

service:
  type: "ClusterIP"
  metricsPort: 8080
  healthPort: 8081
  annotations: {}

namespace: "pangolin-system"

# PriorityClass is disabled by default. Enable to create and assign a
# chart-managed PriorityClass to the controller pods.
priorityClass:
  enabled: false
  name: ""  # Defaults to the chart fullname when enabled
  value: 1000000
  globalDefault: false
  preemptionPolicy: "PreemptLowerPriority"
  description: "Priority class for Pangolin Gateway Controller pods"

# RBAC Configuration
rbac:
  create: true
  # Gateway API permissions required
  gatewayApi: true
  # Deployments, Services, Secrets permissions required for Newt VPN
  newtManagement: true

# GatewayClass Configuration
# NOTE: GatewayClass is cluster-scoped and shared across namespaces.
# It's recommended to install it separately using config/gatewayclass.yaml
# to avoid conflicts with multiple chart installations.
gatewayClass:
  enable: false  # Set to true to manage GatewayClass via this chart
  name: "pangolin"
  description: "Pangolin Gateway for Kubernetes Gateway API integration"
  annotations: {}

# Pangolin API Configuration
pangolin:
  apiKey: ""  # Set via secret or during deployment
  orgId: ""   # Set via secret or during deployment
  baseUrl: "https://api.pangolin.net/v1"
  # newtEndpoint is auto-derived from baseUrl if not specified
  newtEndpoint: ""
  newtImage: "fosrl/newt:1.10.0"

# Controller Configuration
controller:
  gatewayClassName: "pangolin"
  watchNamespace: ""  # Empty = watch all namespaces
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  leaderElection: true
  leaderElectionId: "pangolin-gateway-controller-leader"

# Logging Configuration
logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json or console

# Extra environment variables
extraEnv: {}

# Pod security context (fsGroup for volume ownership)
podSecurityContext:
  fsGroup: 65532

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Resource limits
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Health probes
livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []
  # - key: "node-role.kubernetes.io/master"
  #   operator: "Exists"
  #   effect: "NoSchedule"
  # - key: "node-role.kubernetes.io/control-plane"
  #   operator: "Exists"
  #   effect: "NoSchedule"
# Affinity
affinity: {}
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: kubernetes.io/hostname
  #         operator: In
  #         values:
  #         - controller
# Autoscaling (disabled by default for controllers)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Persistence (disabled by default)
persistence:
  enabled: false
  capacity: "8Mi"
  mountPath: "/data"

# PodDisruptionBudget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# NetworkPolicy coverage for Popeye/compliance without enforcing cluster-specific traffic by default.
# Override ingress/egress with stricter rules if your cluster networking model requires it.
networkPolicy:
  enabled: true
  ingress:
    - {}
  egress:
    - {}

# Admission webhooks (disabled by default)
# Requires TLS certificates — provide via caBundle or enable certManager integration.
webhook:
  enabled: false
  # failurePolicy: Fail or Ignore
  failurePolicy: "Fail"
  # Port for the webhook server inside the container
  port: 9443
  # Base64-encoded CA bundle (required if certManager is false)
  caBundle: ""
  # Set to true to let cert-manager inject the CA bundle automatically
  certManager: false
  # TLS certificate and key paths inside the container
  certDir: "/tmp/k8s-webhook-server/serving-certs"
