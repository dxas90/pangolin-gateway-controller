replicaCount: 1

image:
  repository: "ghcr.io/dxas90/pangolin-gateway-controller"
  pullPolicy: "IfNotPresent"
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "pangolin-gateway-controller"

service:
  type: "ClusterIP"
  metricsPort: 8080
  healthPort: 8081
  annotations: {}

namespace: "pangolin-system"

# RBAC Configuration
rbac:
  create: true
  # Gateway API permissions required
  gatewayApi: true
  # Deployments, Services, Secrets permissions required for Newt VPN
  newtManagement: true

# GatewayClass Configuration
# NOTE: GatewayClass is cluster-scoped and shared across namespaces.
# It's recommended to install it separately using config/gatewayclass.yaml
# to avoid conflicts with multiple chart installations.
gatewayClass:
  enable: false  # Set to true to manage GatewayClass via this chart
  name: "pangolin"
  description: "Pangolin Gateway for Kubernetes Gateway API integration"
  annotations: {}

# Pangolin API Configuration
pangolin:
  apiKey: ""  # Set via secret or during deployment
  orgId: ""   # Set via secret or during deployment
  baseUrl: "https://api.pangolin.net/v1"
  # newtEndpoint is auto-derived from baseUrl if not specified
  newtEndpoint: ""
  newtImage: "fosrl/newt:1.10.0"

# Controller Configuration
controller:
  gatewayClassName: "pangolin"
  watchNamespace: ""  # Empty = watch all namespaces
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  leaderElection: true
  leaderElectionId: "pangolin-gateway-controller-leader"

# Logging Configuration
logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json or console

# Extra environment variables
extraEnv: {}

# Pod security context (fsGroup for volume ownership)
podSecurityContext:
  fsGroup: 65532

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Resource limits
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Health probes
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Autoscaling (disabled by default for controllers)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Persistence (disabled by default)
persistence:
  enabled: false
  capacity: "8Mi"
  mountPath: "/data"

# PodDisruptionBudget for high availability
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# NetworkPolicy to restrict ingress/egress
networkPolicy:
  enabled: false

# Admission webhooks (disabled by default)
# Requires TLS certificates — provide via caBundle or enable certManager integration.
webhook:
  enabled: false
  # failurePolicy: Fail or Ignore
  failurePolicy: "Fail"
  # Port for the webhook server inside the container
  port: 9443
  # Base64-encoded CA bundle (required if certManager is false)
  caBundle: ""
  # Set to true to let cert-manager inject the CA bundle automatically
  certManager: false
  # TLS certificate and key paths inside the container
  certDir: "/tmp/k8s-webhook-server/serving-certs"
