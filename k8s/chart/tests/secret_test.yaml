suite: test secret
templates:
  - secret.yaml
tests:
  - it: should create secret when credentials are provided
    set:
      pangolin.apiKey: "test-api-key"
      pangolin.orgId: "test-org-id"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pangolin-gateway-controller-credentials
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.api-key
          value: "test-api-key"
      - equal:
          path: stringData.org-id
          value: "test-org-id"
      - equal:
          path: stringData.base-url
          value: "https://api.pangolin.net/v1"

  - it: should not create secret when credentials are empty
    asserts:
      - hasDocuments:
          count: 0
