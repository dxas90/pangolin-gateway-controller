suite: test deployment
templates:
  - deployment.yaml
tests:
  - it: should create deployment with default values
    set:
      pangolin.apiKey: "test-key"
      pangolin.orgId: "test-org"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pangolin-gateway-controller
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: controller
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/dxas90/pangolin-gateway-controller:latest

  - it: should use custom image tag
    set:
      image.tag: "v1.2.3"
      pangolin.apiKey: "test-key"
      pangolin.orgId: "test-org"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/dxas90/pangolin-gateway-controller:v1.2.3

  - it: should set resource limits and requests
    set:
      resources.limits.memory: "256Mi"
      resources.requests.memory: "128Mi"
      pangolin.apiKey: "test-key"
      pangolin.orgId: "test-org"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: should include environment variables from secret
    set:
      pangolin.apiKey: "test-key"
      pangolin.orgId: "test-org"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGOLIN_API_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-pangolin-gateway-controller-credentials
                key: api-key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PANGOLIN_ORG_ID
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-pangolin-gateway-controller-credentials
                key: org-id

  - it: should have correct security context
    set:
      pangolin.apiKey: "test-key"
      pangolin.orgId: "test-org"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should have correct ports
    set:
      pangolin.apiKey: "test-key"
      pangolin.orgId: "test-org"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8080
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            containerPort: 8081
            protocol: TCP

  - it: should have args with --env-config
    set:
      pangolin.apiKey: "test-key"
      pangolin.orgId: "test-org"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--env-config"
