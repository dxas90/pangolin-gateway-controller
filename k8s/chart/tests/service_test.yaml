suite: test service
templates:
  - service.yaml
tests:
  - it: should create service with metrics and health ports
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pangolin-gateway-controller-metrics
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 8080
            targetPort: metrics
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: health
            port: 8081
            targetPort: health
            protocol: TCP

  - it: should include correct labels
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: pangolin-gateway-controller
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: metrics
