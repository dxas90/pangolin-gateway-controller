suite: test service account
templates:
  - serviceaccount.yaml
tests:
  - it: should disable automounting API server credentials by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should allow automount override
    set:
      serviceAccount.automount: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
