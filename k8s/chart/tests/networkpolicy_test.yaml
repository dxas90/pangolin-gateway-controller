suite: test network policy
templates:
  - networkpolicy.yaml
tests:
  - it: should create NetworkPolicy by default
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: should not create NetworkPolicy when disabled
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create NetworkPolicy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pangolin-gateway-controller
      - equal:
          path: metadata.namespace
          value: pangolin-system

  - it: should have correct pod selector
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: pangolin-gateway-controller
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have both Ingress and Egress policy types
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should allow all ingress by default for compliance-only coverage
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0]
          value: {}

  - it: should allow all egress by default for compliance-only coverage
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress[0]
          value: {}

  - it: should render custom ingress and egress rules when provided
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress:
        - ports:
            - port: 9090
              protocol: TCP
      networkPolicy.egress:
        - ports:
            - port: 443
              protocol: TCP
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 9090
            protocol: TCP
      - contains:
          path: spec.egress[0].ports
          content:
            port: 443
            protocol: TCP

  - it: should include standard labels
    set:
      networkPolicy.enabled: true
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pangolin-gateway-controller
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
