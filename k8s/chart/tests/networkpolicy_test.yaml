suite: test network policy
templates:
  - networkpolicy.yaml
tests:
  - it: should not create NetworkPolicy when disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create NetworkPolicy when enabled
    set:
      networkPolicy.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pangolin-gateway-controller
      - equal:
          path: metadata.namespace
          value: pangolin-system

  - it: should have correct pod selector
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: pangolin-gateway-controller
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should have both Ingress and Egress policy types
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: should allow ingress on metrics port 8080
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8080
            protocol: TCP

  - it: should allow ingress on health port 8081
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8081
            protocol: TCP

  - it: should allow ingress on custom ports
    set:
      networkPolicy.enabled: true
      service.metricsPort: 9090
      service.healthPort: 9091
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 9090
            protocol: TCP
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 9091
            protocol: TCP

  - it: should allow all egress traffic
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress[0]
          value: {}

  - it: should include standard labels
    set:
      networkPolicy.enabled: true
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pangolin-gateway-controller
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
