{{- if or .Values.pangolin.apiKey .Values.pangolin.orgId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "base.fullname" . }}-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "base.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ .Values.pangolin.apiKey | required "pangolin.apiKey is required" | quote }}
  orgId: {{ .Values.pangolin.orgId | required "pangolin.orgId is required" | quote }}
  baseUrl: {{ .Values.pangolin.baseUrl | quote }}
{{- end }}
