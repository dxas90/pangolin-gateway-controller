{{- if .Values.gatewayClass.enable }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  {{- with .Values.gatewayClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  controllerName: pangol.in/gateway-controller
  {{- if .Values.gatewayClass.description }}
  description: {{ .Values.gatewayClass.description | quote }}
  {{- end }}
{{- end }}
