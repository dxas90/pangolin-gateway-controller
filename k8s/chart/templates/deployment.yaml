apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "base.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "base.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.metricsPort }}"
        prometheus.io/path: "/metrics"
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "base.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "base.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --env-config
          env:
            # Pangolin API credentials from secret
            - name: PANGOLIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "base.fullname" . }}-credentials
                  key: api-key
            - name: PANGOLIN_ORG_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "base.fullname" . }}-credentials
                  key: org-id
            - name: PANGOLIN_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "base.fullname" . }}-credentials
                  key: base-url
            {{- if .Values.pangolin.newtEndpoint }}
            - name: NEWT_ENDPOINT
              value: {{ .Values.pangolin.newtEndpoint | quote }}
            {{- end }}
            # Controller configuration
            - name: ENABLE_LEADER_ELECTION
              value: {{ .Values.controller.leaderElection | quote }}
            - name: GATEWAY_CLASS_NAME
              value: {{ .Values.controller.gatewayClassName | quote }}
            {{- if .Values.controller.watchNamespace }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.controller.watchNamespace | quote }}
            {{- end }}
            - name: METRICS_BIND_ADDRESS
              value: {{ .Values.controller.metricsBindAddress | quote }}
            - name: HEALTH_PROBE_BIND_ADDRESS
              value: {{ .Values.controller.healthProbeBindAddress | quote }}
            - name: LEADER_ELECTION_ID
              value: {{ .Values.controller.leaderElectionId | quote }}
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: NEWT_IMAGE
              value: {{ .Values.pangolin.newtImage | quote }}
            # Pod metadata for leader election
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
