---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pangolin-gateway-controller
  namespace: pangolin-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pangolin-gateway-controller
rules:
  # Gateway API permissions
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
      - grpcroutes/status
    verbs:
      - get
      - update
      - patch
  # Core K8s resources
  - apiGroups:
      - ""
    resources:
      - services
      - endpoints
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Discovery for service endpoints
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pangolin-gateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pangolin-gateway-controller
subjects:
  - kind: ServiceAccount
    name: pangolin-gateway-controller
    namespace: pangolin-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pangolin-gateway-controller-leader-election
  namespace: pangolin-system
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pangolin-gateway-controller-leader-election
  namespace: pangolin-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pangolin-gateway-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: pangolin-gateway-controller
    namespace: pangolin-system
